name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.13 }
      - run: gradle assembleDebug --no-daemon
      - name: Name the APK
        id: ver
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "OpenWebUI-v$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: OpenWebUI-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Open WebUI Android v${{ steps.ver.outputs.v }}
          files: OpenWebUI-v${{ steps.ver.outputs.v }}.apk
          make_latest: true
          body: |
            Debug-signed APK. Download the .apk below on your Android phone and open it to install.
            See the README for what's new.
