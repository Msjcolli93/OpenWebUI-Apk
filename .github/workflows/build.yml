name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.13 }
      - run: gradle assembleDebug --no-daemon
      - name: Name the APK
        id: ver
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "OpenWebUI-v$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: OpenWebUI-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish v1.0 (archived build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          target_commitish: ${{ github.sha }}
          name: Open WebUI Android v1.0
          files: legacy/OpenWebUI-v1.0.apk
          make_latest: false
          body: |
            Initial release: WebView wrapper with a server address prompt, file uploads, voice permissions and external link handling.

            Archived APK. The tag points at the current source, not the v1.0 source. This APK uses a different signing key than v1.2, so uninstall it before installing v1.2 or later.
      - name: Publish v1.1 (archived build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          target_commitish: ${{ github.sha }}
          name: Open WebUI Android v1.1
          files: legacy/OpenWebUI-v1.1.apk
          make_latest: false
          body: |
            Adds notifications when a response finishes while the app is in the background.

            Archived APK. The tag points at the current source, not the v1.1 source. This APK uses a different signing key than v1.2, so uninstall it before installing v1.2 or later.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Open WebUI Android v${{ steps.ver.outputs.v }}
          files: OpenWebUI-v${{ steps.ver.outputs.v }}.apk
          make_latest: true
          body: |
            Debug-signed APK. Download the .apk below on your Android phone and open it to install.
            See the README for what's new.
