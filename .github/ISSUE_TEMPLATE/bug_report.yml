name: Bug report
description: Something in the app isn't working
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open settings\n2. Tap ...\n3. ..."
  - type: input
    id: app
    attributes:
      label: App version
      description: Shown by Settings > Check for updates (e.g. 1.4.1)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone model
      placeholder: "Android 14, Pixel 8"
    validations:
      required: true
  - type: dropdown
    id: https
    attributes:
      label: Does your Open WebUI server use HTTPS?
      options: ["Yes", "No (http://)", "Not sure"]
  - type: dropdown
    id: area
    attributes:
      label: Which feature is affected?
      options: ["Login / server connection", "Notifications", "Share to chat", "Screen lock", "Call mode / voice", "Community hub", "Downloads / camera", "Widget / shortcuts", "Updates", "Other"]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or other details
